name: wildhills-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: wildhills-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wh_owner
      POSTGRES_PASSWORD: dev-secret-password
      POSTGRES_DB: wild_hills
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wh_owner -d wild_hills"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: wildhills-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:latest
    container_name: wildhills-dev-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI / HTTP API
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: "" # In-memory storage for clean testing

volumes:
  pgdata:
  miniodata:

